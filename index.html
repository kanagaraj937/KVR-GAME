<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KVR PRIVATE BUS - KALVARAYAN 3D</title>
<style>body{margin:0;overflow:hidden;background:#000;font-family:monospace}canvas{display:block}
#ui{position:fixed;z-index:10;left:10px;top:10px;color:#fff;background:rgba(0,0,0,0.6);padding:8px 12px;border-radius:10px;border-left:4px solid yellow}
#dash{position:fixed;bottom:0;width:100%;height:88px;background:linear-gradient(#222,#000);z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-top:3px solid #ffcc00}
.btn{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:#222;border:2px solid #555;color:#fff}
#start{position:fixed;inset:0;background:radial-gradient(#331a00,#000);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
button{background:#ffcc00;color:#000;border:none;padding:14px 28px;font-weight:900;border-radius:12px;margin-top:12px}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="ui"><div style="color:#ffcc00;font-weight:900">🚌 KALVARAYAN PRIVATE EXPRESS</div><div id="info">SPEED: 0 | STOP: Vellimalai | 0/21 BENDS</div></div>
<div id="dash"><div class="btn" id="left">⬅️</div><div style="display:flex;gap:10px"><div class="btn" id="horn" style="background:#ffcc00;color:#000">📯</div><div class="btn" id="door" style="border-color:#ffcc00">🚪</div><div class="btn" id="brake">🛑</div></div><div class="btn" id="right">➡️</div></div>
<div id="start"><div style="background:#ffcc00;color:#000;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900">KALLAKURICHI - KALVARAYAN MALAI</div><h1 style="color:#ffcc00;font-size:48px;line-height:0.9">PRIVATE BUS<br><span style="color:#fff">SIMULATOR</span></h1><p style="color:#ffcc00;margin:8px;font-size:12px">21 HAIRPIN • TEA KADAI • PASSENGERS</p><p style="opacity:0.6;font-size:10px">Colorful private bus, Air horn, Village stops</p><button onclick="start()">START ENGINE 🔊</button></div>
<script type="module">
import * as THREE from 'three';
let scene,camera,renderer,busGroup,bus,road,run=false,keys={},speed=0,posZ=0,km=0,bendCount=0,stopName="Vellimalai",stops=["Vellimalai","Injapattu","Maniyarpalayam","Periya Nagalur","Chinna Nagalur","Koolipatti","Veppadi","MEL HILL TOP"];
function init(){
 scene=new THREE.Scene();scene.fog=new THREE.Fog(0x1a2a0a,30,280);
 camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
 scene.add(new THREE.AmbientLight(0xffffff,0.9));let sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(20,40,10);scene.add(sun);
 // Road - twisty Kalvarayan style
 let roadGeo=new THREE.PlaneGeometry(18,3000,8,300);roadGeo.rotateX(-Math.PI/2);
 let p=roadGeo.attributes.position;for(let i=0;i<p.count;i++){let z=p.getZ(i);p.setX(i,p.getX(i)+Math.sin(z*0.015)*25 + Math.sin(z*0.05)*6); p.setY(i, Math.sin(z*0.008)*8 + z*0.01);}p.needsUpdate=true;
 road=new THREE.Mesh(roadGeo,new THREE.MeshStandardMaterial({color:0x2a2a2a}));scene.add(road);
 // Side lines yellow
 for(let i=0;i<400;i++){let line=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.1,4),new THREE.MeshStandardMaterial({color:i%2==0?0xffcc00:0x2a2a2a}));line.position.set(-9,0.05,-i*7+Math.sin(-i*7*0.015)*25);scene.add(line);let line2=line.clone();line2.position.x=9;scene.add(line2);}
 // Hills
 for(let i=0;i<60;i++){let h=new THREE.Mesh(new THREE.ConeGeometry(10+Math.random()*25,30+Math.random()*60,7),new THREE.MeshStandardMaterial({color:0x0f3a0f}));h.position.set((Math.random()-0.5)*400,15,-Math.random()*2800);scene.add(h);}
 // Private Bus Group - Colorful
 busGroup=new THREE.Group();
 let body=new THREE.Mesh(new THREE.BoxGeometry(4.5,3.2,11),new THREE.MeshStandardMaterial({color:0xffcc00}));body.position.y=1.8;busGroup.add(body);
 let body2=new THREE.Mesh(new THREE.BoxGeometry(4.6,1.2,11.2),new THREE.MeshStandardMaterial({color:0xcc0000}));body2.position.y=1.2;busGroup.add(body2);
 let front=new THREE.Mesh(new THREE.BoxGeometry(4.5,2.5,1),new THREE.MeshStandardMaterial({color:0xffffff}));front.position.set(0,1.8,5.8);busGroup.add(front);
 let glass=new THREE.Mesh(new THREE.BoxGeometry(4.2,1.4,0.5),new THREE.MeshStandardMaterial({color:0x88ccff,transparent:true,opacity:0.7}));glass.position.set(0,2.4,6.1);busGroup.add(glass);
 // Tamil text board
 let board=new THREE.Mesh(new THREE.BoxGeometry(3,0.6,0.2),new THREE.MeshStandardMaterial({color:0x0000aa}));board.position.set(0,2.8,6.2);busGroup.add(board);
 // wheels
 for(let x of [-2,2]){for(let z of [-3.5,3.5]){let w=new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,0.6,12),new THREE.MeshStandardMaterial({color:0x111}));w.rotation.z=Math.PI/2;w.position.set(x,0.4,z);busGroup.add(w);}}
 busGroup.position.set(0,0,15);scene.add(busGroup);
 camera.position.set(0,8,24);camera.lookAt(busGroup.position);
 animate();
}
let bendTimer=0;
function animate(){
 requestAnimationFrame(animate);
 if(!run){renderer.render(scene,camera);return;}
 if(keys.w||keys.up) speed=Math.min(1.2,speed+0.012); else speed*=0.985;
 if(keys.s||keys.down) speed=Math.max(0,speed-0.025);
 if(keys.a||keys.left) busGroup.position.x-=0.18+speed*0.1;
 if(keys.b||keys.right) busGroup.position.x+=0.18+speed*0.1;
 busGroup.position.x=Math.max(-7,Math.min(7,busGroup.position.x));
 road.position.z+=speed*12; if(road.position.z>500){road.position.z=0; bendCount++; if(bendCount>21)bendCount=1; let idx=Math.floor(Math.random()*stops.length);stopName=stops[idx];}
 // tilt on curve
 let curve=Math.sin(road.position.z*0.015)*0.4; busGroup.rotation.z = -curve*0.3 - busGroup.position.x*0.06;
 busGroup.rotation.y = -curve*0.2;
 camera.position.x+= (busGroup.position.x - camera.position.x)*0.06;
 camera.position.z=24+speed*2;
 camera.lookAt(busGroup.position.x,1.5,busGroup.position.z-10);
 document.getElementById('info').textContent=`SPEED: ${Math.floor(speed*70)} | STOP: ${stopName} | ${bendCount}/21 BENDS`;
 renderer.render(scene,camera);
}
window.start=()=>{document.getElementById('start').style.display='none';run=true;init();}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true; if(e.key=='ArrowLeft')keys.left=true; if(e.key=='ArrowRight')keys.right=true; if(e.key=='ArrowUp')keys.up=true; if(e.key=='ArrowDown')keys.down=true;});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false; if(e.key=='ArrowLeft')keys.left=false; if(e.key=='ArrowRight')keys.right=false; if(e.key=='ArrowUp')keys.up=false; if(e.key=='ArrowDown')keys.down=false;});
document.getElementById('left').addEventListener('touchstart',()=>keys.left=true);document.getElementById('left').addEventListener('touchend',()=>keys.left=false);
document.getElementById('right').addEventListener('touchstart',()=>keys.right=true);document.getElementById('right').addEventListener('touchend',()=>keys.right=false);
document.getElementById('brake').addEventListener('touchstart',()=>speed*=0.85);
document.getElementById('horn').addEventListener('touchstart',()=>{let a=new Audio();document.getElementById('horn').style.transform='scale(1.2)';setTimeout(()=>document.getElementById('horn').style.transform='scale(1)',150);});
addEventListener('resize',()=>{if(camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}});
</script>
</body>
</html>
