<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KVR 3D - KALVARAYAN HILLS</title>
<style>body{margin:0;overflow:hidden;background:#000}canvas{display:block}#ui{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#7CFC00;font-family:monospace;background:rgba(0,0,0,0.7);padding:8px 18px;border-radius:10px;border:1px solid #7CFC00}#start{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}button{background:#7CFC00;color:#000;border:none;padding:14px 28px;font-weight:900;border-radius:10px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="start"><h1 style="color:#7CFC00">KVR 3D<br>KALVARAYAN HILLS</h1><p>Full 3D • WebGL • Real Hills</p><button onclick="start()">START 3D RIDE 🏔️</button></div>
<div id="ui">SPEED: <span id="sp">0</span> KM/H | WASD / Swipe</div>
<script type="module">
import * as THREE from 'three';
let scene,camera,renderer,bike,road,hills=[],run=false,keys={},speed=0;
function init(){
 scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0a2a0a,40,200);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
 // Light
 let sun=new THREE.DirectionalLight(0xffffff,1.5);sun.position.set(10,20,10);scene.add(sun);scene.add(new THREE.AmbientLight(0x445544,0.8));
 // Road - 3D Plane with curves
 let roadGeo=new THREE.PlaneGeometry(20,1000,10,100);roadGeo.rotateX(-Math.PI/2);
 let pos=roadGeo.attributes.position;
 for(let i=0;i<pos.count;i++){let z=pos.getZ(i);pos.setX(i,pos.getX(i)+Math.sin(z*0.03)*8); pos.setY(i,Math.sin(z*0.02)*2);} pos.needsUpdate=true;
 let roadMat=new THREE.MeshStandardMaterial({color:0x333333}); road=new THREE.Mesh(roadGeo,roadMat);scene.add(road);
 // Hills 3D
 for(let i=0;i<20;i++){
  let hGeo=new THREE.ConeGeometry(15+Math.random()*20,40+Math.random()*40,8);
  let hMat=new THREE.MeshStandardMaterial({color:0x1a4a1a});
  let h=new THREE.Mesh(hGeo,hMat);
  h.position.set((Math.random()-0.5)*200,10, -Math.random()*900); scene.add(h); hills.push(h);
 }
 // Bike 3D Box (you can change to GLB model later)
 let bGeo=new THREE.BoxGeometry(1,0.8,2);let bMat=new THREE.MeshStandardMaterial({color:0x7CFC00});bike=new THREE.Mesh(bGeo,bMat);bike.position.set(0,0.6,10);scene.add(bike);
 // Trees
 for(let i=0;i<80;i++){
  let tGeo=new THREE.ConeGeometry(0.6,3,6);let t=new THREE.Mesh(tGeo,new THREE.MeshStandardMaterial({color:0x0a5a0a}));
  t.position.set((Math.random()>0.5?12+Math.random()*20:-12-Math.random()*20),1.5, Math.random()*1000-500);scene.add(t);
 }
 camera.position.set(0,5,16);camera.lookAt(0,0,0);
 animate();
}
function animate(){
 requestAnimationFrame(animate);
 if(!run){renderer.render(scene,camera);return;}
 if(keys.w||keys.up)speed=Math.min(0.8,speed+0.01); else speed*=0.99;
 if(keys.s||keys.down)speed=Math.max(0,speed-0.02);
 if(keys.a||keys.left)bike.position.x-=0.15; if(keys.d||keys.right)bike.position.x+=0.15;
 bike.position.x=Math.max(-8,Math.min(8,bike.position.x));
 // move road
 road.position.z+=speed*10; if(road.position.z>400)road.position.z=0;
 // move camera with bike
 camera.position.x+= (bike.position.x*0.6 - camera.position.x)*0.05;
 camera.lookAt(bike.position.x,0,bike.position.z-20);
 // animals as boxes
 document.getElementById('sp').textContent=Math.floor(speed*180);
 renderer.render(scene,camera);
}
window.start=()=>{document.getElementById('start').style.display='none';run=true;init();}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true; if(e.key=='ArrowLeft')keys.left=true;if(e.key=='ArrowRight')keys.right=true;if(e.key=='ArrowUp')keys.up=true;if(e.key=='ArrowDown')keys.down=true;});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false; if(e.key=='ArrowLeft')keys.left=false;if(e.key=='ArrowRight')keys.right=false;if(e.key=='ArrowUp')keys.up=false;if(e.key=='ArrowDown')keys.down=false;});
let sx=0;addEventListener('touchstart',e=>sx=e.touches[0].clientX);addEventListener('touchmove',e=>{let dx=e.touches[0].clientX-sx; bike.position.x+=dx*0.01; sx=e.touches[0].clientX;},{passive:false});
addEventListener('resize',()=>{if(camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}});
</script>
</body>
</html>
