<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PRIVATE BUS - 100% WORKING</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#0a1a0a;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:8px;left:8px;color:#ffcc00;background:#000;padding:6px 10px;border-radius:8px;font-family:monospace;font-size:12px;z-index:10;border:1px solid #ffcc00}
#controls{position:fixed;bottom:0;width:100%;height:100px;display:flex;justify-content:space-between;align-items:center;padding:0 10px;z-index:10}
.btn{width:80px;height:80px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;background:rgba(255,204,0,0.25);border:3px solid #ffcc00;user-select:none}
#gasBox{position:fixed;right:10px;bottom:120px;z-index:10;display:flex;flex-direction:column;gap:10px}
#start{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
</style>
</head>
<body>
<div id="ui">SPEED: <span id="sp">0</span> | BUS X: <span id="bx">0</span></div>
<div id="gasBox"><div class="btn" id="gas" style="background:#ffcc00;color:#000;width:90px">GAS ⚡</div><div class="btn" id="brake" style="border-color:red">🛑</div></div>
<div id="controls"><div class="btn" id="left">◀️</div><div class="btn" id="right">▶️</div></div>
<div id="start"><h1 style="color:#ffcc00;font-size:36px">🚌 PRIVATE BUS<br>100% WORKING</h1><p style="margin:10px;opacity:0.7">GAS PUDICHU ODU DA!</p><button onclick="document.getElementById('start').style.display='none';run=true" style="background:#ffcc00;color:#000;border:none;padding:14px 28px;font-weight:900;border-radius:10px;font-size:18px">START 🚌</button></div>
<canvas id="c"></canvas>
<script>
let cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=innerWidth,H=innerHeight;
cv.width=W;cv.height=H;
let busX=W/2,speed=0,roadY=0,bend=0,run=false;
let keys={l:false,r:false,gas:false,brake:false};
function loop(){
requestAnimationFrame(loop);
if(!run){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffcc00';ctx.font='20px monospace';ctx.textAlign='center';ctx.fillText('Press START',W/2,H/2);return;}
if(keys.gas) speed=Math.min(12,speed+0.25); else if(keys.brake) speed=Math.max(0,speed-0.5); else speed*=0.98;
if(keys.l) busX-=6+speed*0.3; if(keys.r) busX+=6+speed*0.3;
busX=Math.max(60,Math.min(W-60,busX));
roadY+=speed; bend=Math.sin(roadY*0.01)*W*0.18;
// DRAW
ctx.fillStyle='#0a2a0a';ctx.fillRect(0,0,W,H);
// hills bg
ctx.fillStyle='#122e12';ctx.beginPath();ctx.moveTo(0,H*0.35+bend*0.1);for(let x=0;x<=W;x+=20)ctx.lineTo(x,H*0.35+Math.sin(x*0.01+roadY*0.01)*30);ctx.lineTo(W,H*0.35);ctx.lineTo(0,H*0.35);ctx.fill();
// road
let roadW=W*0.65;let roadX=W*0.175+bend*0.3;
ctx.fillStyle='#2a2a2a';ctx.fillRect(roadX-10,0,roadW+20,H);
ctx.fillStyle='#333';ctx.fillRect(roadX,0,roadW,H);
ctx.strokeStyle='#ffcc00';ctx.setLineDash([20,20]);ctx.beginPath();ctx.moveTo(roadX+roadW/2+bend*0.1,0);ctx.lineTo(roadX+roadW/2+bend*0.1,H);ctx.stroke();ctx.setLineDash([]);
// road lines white
for(let y=-40+roadY%80;y<H;y+=80){ctx.fillStyle='#fff';ctx.fillRect(roadX-6,y,6,30);ctx.fillRect(roadX+roadW,y,6,30);}
// bend boards
if(Math.floor(roadY/500)%2==0){ctx.fillStyle='#fff';ctx.fillRect(W/2+bend-40, (roadY%500),80,28);ctx.fillStyle='#000';ctx.font='14px monospace';ctx.textAlign='center';ctx.fillText(Math.floor(roadY/500)%22+"/21 BEND",W/2+bend, (roadY%500)+18);}
// BUS - top view but looks like bus
let by=H-130;
ctx.save();ctx.translate(busX,by);ctx.rotate((busX-W/2)*0.0005 + bend*0.0002);
// shadow
ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(-42,10,84,20);
// body yellow
ctx.fillStyle='#ffcc00';ctx.fillRect(-40,-28,80,56);
// red stripe
ctx.fillStyle='#cc0000';ctx.fillRect(-40,-8,80,10);
// windows blue
ctx.fillStyle='#87ceeb';ctx.fillRect(-35,-26,70,14);
// front
ctx.fillStyle='#fff';ctx.fillRect(-38,22,76,12);
// lights
ctx.fillStyle=speed>2?'#ffff99':'#555';ctx.fillRect(-30,32,12,6);ctx.fillRect(18,32,12,6);
// text
ctx.fillStyle='#0000aa';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText('KALVARAYAN',0,0);
ctx.restore();
document.getElementById('sp').textContent=Math.floor(speed*8);
document.getElementById('bx').textContent=Math.floor(busX);
}
loop();
// touch
function bind(id,k){let e=document.getElementById(id);e.addEventListener('touchstart',ev=>{ev.preventDefault();keys[k]=true;},{passive:false});e.addEventListener('touchend',ev=>{ev.preventDefault();keys[k]=false;});e.addEventListener('mousedown',()=>keys[k]=true);e.addEventListener('mouseup',()=>keys[k]=false);e.addEventListener('mouseleave',()=>keys[k]=false);}
bind('left','l');bind('right','r');bind('gas','gas');bind('brake','brake');
window.addEventListener('keydown',e=>{if(e.key=='ArrowLeft'||e.key=='a')keys.l=true;if(e.key=='ArrowRight'||e.key=='d')keys.r=true;if(e.key=='ArrowUp'||e.key=='w')keys.gas=true;if(e.key=='ArrowDown'||e.key=='s')keys.brake=true;});
window.addEventListener('keyup',e=>{if(e.key=='ArrowLeft'||e.key=='a')keys.l=false;if(e.key=='ArrowRight'||e.key=='d')keys.r=false;if(e.key=='ArrowUp'||e.key=='w')keys.gas=false;if(e.key=='ArrowDown'||e.key=='s')keys.brake=false;});
window.addEventListener('resize',()=>{W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;});
</script>
</body>
</html>
