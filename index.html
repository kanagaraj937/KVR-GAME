<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KVR PRIVATE BUS - FIXED</title>
<style>
body{margin:0;overflow:hidden;background:#000;touch-action:none;font-family:monospace}
canvas{display:block}
#ui{position:fixed;top:10px;left:10px;z-index:10;color:#ffcc00;background:#000;padding:6px 10px;border-radius:8px;font-size:12px;border:1px solid #ffcc00}
#controls{position:fixed;bottom:10px;width:100%;display:flex;justify-content:space-between;padding:0 15px;z-index:10;box-sizing:border-box}
.cbtn{width:70px;height:70px;border-radius:16px;background:rgba(255,204,0,0.2);border:2px solid #ffcc00;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
#gas{position:fixed;bottom:110px;right:15px;z-index:10;display:flex;flex-direction:column;gap:10px}
#start{position:fixed;inset:0;background:#111;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
button{background:#ffcc00;color:#000;border:none;padding:14px 30px;font-weight:900;border-radius:10px;font-size:16px}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="ui">SPEED: <span id="sp">0</span> | <span id="bend">0/21</span> BEND</div>
<div id="controls"><div class="cbtn" id="L">◀️</div><div class="cbtn" id="R">▶️</div></div>
<div id="gas"><div class="cbtn" id="GAS" style="background:#ffcc00;color:#000">⚡ GAS</div><div class="cbtn" id="BRAKE">🛑</div><div class="cbtn" id="HORN" style="background:red;border-color:red">📯</div></div>
<div id="start"><h1 style="color:#ffcc00">PRIVATE BUS<br>FIXED V7</h1><p style="opacity:0.7;margin:8px">GAS amukku - Bus pogum da!</p><button onclick="start()">START DRIVE 🚌</button><p style="margin-top:10px;font-size:10px;opacity:0.5">LEFT/RIGHT + GAS</p></div>
<script type="module">
import * as THREE from 'three';
let scene,camera,renderer,bus,road,run=false,speed=0,busX=0,roadZ=0,bend=0;
function init(){
 scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0a1a0a,20,200);
 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
 scene.add(new THREE.AmbientLight(0xffffff,0.8));
 let sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(10,20,10);scene.add(sun);
 // Road
 let rg=new THREE.PlaneGeometry(20,4000,10,200);rg.rotateX(-Math.PI/2);
 let p=rg.attributes.position;for(let i=0;i<p.count;i++){let z=p.getZ(i);p.setX(i,p.getX(i)+Math.sin(z*0.012)*18);p.setY(i,Math.sin(z*0.008)*4);}p.needsUpdate=true;
 road=new THREE.Mesh(rg,new THREE.MeshStandardMaterial({color:0x222}));scene.add(road);
 // Hills
 for(let i=0;i<50;i++){let m=new THREE.Mesh(new THREE.ConeGeometry(8+Math.random()*15,20+Math.random()*30,6),new THREE.MeshStandardMaterial({color:0x123a12}));m.position.set((Math.random()-0.5)*300,8,-Math.random()*3000);scene.add(m);}
 // BUS - Manjal
 bus=new THREE.Group();
 let body=new THREE.Mesh(new THREE.BoxGeometry(4.5,3,10),new THREE.MeshStandardMaterial({color:0xffcc00}));body.position.y=1.5;bus.add(body);
 let top=new THREE.Mesh(new THREE.BoxGeometry(4.6,0.8,10.2),new THREE.MeshStandardMaterial({color:0xd00000}));top.position.y=2.8;bus.add(top);
 let glass=new THREE.Mesh(new THREE.BoxGeometry(4.3,1.2,0.3),new THREE.MeshStandardMaterial({color:0x87ceeb}));glass.position.set(0,1.8,5.1);bus.add(glass);
 for(let z of [-3,3]){for(let x of [-2,2]){let w=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,0.5,10),new THREE.MeshStandardMaterial({color:0x111}));w.rotation.z=Math.PI/2;w.position.set(x,0.3,z);bus.add(w);}}
 bus.position.set(0,0,12);scene.add(bus);
 camera.position.set(0,7,20);camera.lookAt(bus.position);
 animate();
}
function animate(){
 requestAnimationFrame(animate);
 if(!run){renderer.render(scene,camera);return;}
 roadZ+=speed; road.position.z=roadZ%500;
 if(roadZ%400<1){bend=(bend+1)%22;document.getElementById('bend').textContent=bend+"/21";}
 bus.position.x+= (busX - bus.position.x)*0.15;
 bus.rotation.z=-bus.position.x*0.08 - Math.sin(roadZ*0.012)*0.2;
 camera.position.x+=(bus.position.x*0.5 - camera.position.x)*0.08;
 camera.lookAt(bus.position.x,1,bus.position.z-8);
 document.getElementById('sp').textContent=Math.floor(speed*100);
 renderer.render(scene,camera);
}
// CONTROLS - FIXED!
let isPress={left:false,right:false,gas:false,brake:false};
function bind(id,key){let el=document.getElementById(id);let startEv=(e)=>{e.preventDefault();isPress[key]=true;};let endEv=()=>{isPress[key]=false;};el.addEventListener('touchstart',startEv,{passive:false});el.addEventListener('touchend',endEv);el.addEventListener('mousedown',startEv);el.addEventListener('mouseup',endEv);el.addEventListener('mouseleave',endEv);}
bind('L','left');bind('R','right');bind('GAS','gas');bind('BRAKE','brake');
setInterval(()=>{
 if(isPress.left) busX-=0.35;
 if(isPress.right) busX+=0.35;
 if(isPress.gas) speed=Math.min(1.5,speed+0.02);
 else if(isPress.brake) speed=Math.max(0,speed-0.05);
 else speed*=0.995;
 busX=Math.max(-8,Math.min(8,busX));
},16);
document.getElementById('HORN').addEventListener('touchstart',()=>{document.getElementById('HORN').innerText='🔊';setTimeout(()=>document.getElementById('HORN').innerText='📯',200);});
window.addEventListener('keydown',e=>{if(e.key=='ArrowLeft'||e.key=='a')isPress.left=true;if(e.key=='ArrowRight'||e.key=='d')isPress.right=true;if(e.key=='ArrowUp'||e.key=='w')isPress.gas=true;if(e.key=='ArrowDown'||e.key=='s')isPress.brake=true;});
window.addEventListener('keyup',e=>{if(e.key=='ArrowLeft'||e.key=='a')isPress.left=false;if(e.key=='ArrowRight'||e.key=='d')isPress.right=false;if(e.key=='ArrowUp'||e.key=='w')isPress.gas=false;if(e.key=='ArrowDown'||e.key=='s')isPress.brake=false;});
window.start=()=>{document.getElementById('start').style.display='none';run=true;init();}
addEventListener('resize',()=>{if(camera){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}});
</script>
</body>
</html>
