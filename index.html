<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KVR DODGE MASS</title>
<style>
body{margin:0;background:#000;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#score{position:fixed;top:10px;left:10px;color:#0f0;font-family:monospace;font-size:20px;z-index:10}
#coins{position:fixed;top:10px;right:10px;color:gold;font-family:monospace;font-size:20px;z-index:10}
#left{position:fixed;bottom:20px;left:20px;width:80px;height:80px;background:rgba(255,0,80,0.3);border:2px solid #ff0055;border-radius:20px;color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;z-index:10}
#right{position:fixed;bottom:20px;right:20px;width:80px;height:80px;background:rgba(255,0,80,0.3);border:2px solid #ff0055;border-radius:20px;color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;z-index:10}
#horn{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);width:70px;height:70px;background:gold;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:35px;z-index:10}
#start{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;color:#fff}
h1{color:#ff0055;font-size:50px;margin:0}
button{background:#ff0055;color:#fff;border:none;padding:15px 30px;border-radius:12px;font-size:18px;font-weight:900;margin-top:20px}
</style>
</head>
<body>
<div id="score">SCORE: <span id="s">0</span></div>
<div id="coins">🪙 <span id="c2">0</span></div>
<div id="left">⬅️</div><div id="right">➡️</div><div id="horn">📯</div>
<div id="start"><h1>KVR<br>DODGE</h1><p>MASS V2 🔥</p><button onclick="go()">PLAY MASS 🔥</button></div>
<canvas id="g"></canvas>
<script>
let cv=document.getElementById('g'),ctx=cv.getContext('2d'),W,H,px,score=0,coins=0,spd=6,obs=[],coin=[],keys={},run=false;
function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;px=W/2;}resize();
addEventListener('resize',resize);
function go(){document.getElementById('start').style.display='none';run=true;init();}
function init(){px=W/2;score=0;coins=0;spd=6;obs=[];coin=[];}
function spawn(){if(Math.random()<0.04)obs.push({x:Math.random()*W*0.7+W*0.15,y:-80});if(Math.random()<0.03)coin.push({x:Math.random()*W*0.7+W*0.15,y:-20});}
function loop(){
if(!run){requestAnimationFrame(loop);return;}
spawn();
if(keys.l)px-=7;if(keys.r)px+=7;px=Math.max(20,Math.min(W-20,px));
obs.forEach((o,i)=>{o.y+=spd;if(o.y>H+80)obs.splice(i,1);if(Math.abs(o.x-px)<30 && Math.abs(o.y-(H-150))<40){alert('GAME OVER! Score:'+Math.floor(score));init();}});
coin.forEach((c,i)=>{c.y+=spd;if(c.y>H)coin.splice(i,1);if(Math.hypot(c.x-px,c.y-(H-150))<30){coins++;score+=10;coin.splice(i,1);}});
score+=0.1;spd=6+score*0.01;
document.getElementById('s').textContent=Math.floor(score);
document.getElementById('c2').textContent=coins;
ctx.fillStyle='#111';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#222';ctx.fillRect(W*0.1,0,W*0.8,H);
ctx.fillStyle='#ff3355';obs.forEach(o=>{ctx.fillRect(o.x-20,o.y-20,40,40);});
ctx.fillStyle='gold';coin.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,10,0,6.28);ctx.fill();});
ctx.font='40px Arial';ctx.textAlign='center';ctx.fillText('🏍️',px,H-150);
requestAnimationFrame(loop);
}loop();
let L=document.getElementById('left'),R=document.getElementById('right'),Ho=document.getElementById('horn');
L.addEventListener('touchstart',e=>{e.preventDefault();keys.l=true;});L.addEventListener('touchend',()=>keys.l=false);
R.addEventListener('touchstart',e=>{e.preventDefault();keys.r=true;});R.addEventListener('touchend',()=>keys.r=false);
L.addEventListener('mousedown',()=>keys.l=true);L.addEventListener('mouseup',()=>keys.l=false);
R.addEventListener('mousedown',()=>keys.r=true);R.addEventListener('mouseup',()=>keys.r=false);
Ho.addEventListener('touchstart',()=>{obs.forEach(o=>{if(Math.abs(o.x-px)<80)o.x+=o.x>px?50:-50;});});
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')keys.l=true;if(e.key=='ArrowRight')keys.r=true;});
addEventListener('keyup',e=>{if(e.key=='ArrowLeft')keys.l=false;if(e.key=='ArrowRight')keys.r=false;});
</script>
</body>
</html>
