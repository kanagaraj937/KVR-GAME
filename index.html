<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KVR - KALVARAYAN HILLS RIDE ⛰️</title>
<style>
body{margin:0;background:#0a1a0a;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#score{position:fixed;top:10px;left:10px;color:#7CFC00;font-family:monospace;font-size:18px;z-index:10;background:rgba(0,0,0,0.6);padding:6px 10px;border-radius:8px;border:1px solid #2e8b57}
#coins{position:fixed;top:10px;right:10px;color:#ffd700;font-family:monospace;font-size:18px;z-index:10;background:rgba(0,0,0,0.6);padding:6px 10px;border-radius:8px;border:1px solid gold}
#left{position:fixed;bottom:20px;left:20px;width:80px;height:80px;background:rgba(34,139,34,0.4);border:2px solid #7CFC00;border-radius:20px;color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;z-index:10}
#right{position:fixed;bottom:20px;right:20px;width:80px;height:80px;background:rgba(34,139,34,0.4);border:2px solid #7CFC00;border-radius:20px;color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;z-index:10}
#horn{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);width:70px;height:70px;background:radial-gradient(circle,#ffd700,#ff8c00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;z-index:10;border:3px solid #fff;box-shadow:0 0 15px gold}
#start{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at bottom,#1a3a1a 0%,#0a1a0a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;color:#fff;text-align:center;padding:20px}
h1{color:#7CFC00;font-size:42px;margin:0;line-height:0.9;text-shadow:0 0 20px #2e8b57}
button{background:linear-gradient(90deg,#228B22,#7CFC00);color:#000;border:none;padding:16px 32px;border-radius:14px;font-size:16px;font-weight:900;margin-top:20px;letter-spacing:1px}
.badge{background:linear-gradient(90deg,#2e8b57,#7CFC00);padding:5px 14px;border-radius:20px;font-size:10px;letter-spacing:2px;margin-bottom:14px;color:#000;font-weight:900}
</style>
</head>
<body>
<div id="score">KM: <span id="s">0</span></div>
<div id="coins">🪙 <span id="c2">0</span></div>
<div id="left">⬅️</div><div id="right">➡️</div><div id="horn">📯</div>
<div id="start">
<div class="badge">KALLAKURICHI MASS ⛰️</div>
<h1>KALVARAYAN<br>HILLS<br>RIDE</h1>
<p style="color:#7CFC00;letter-spacing:3px;font-size:12px;margin:10px 0">KVR EDITION 🔥</p>
<p style="font-size:11px;opacity:0.7;line-height:1.6">Malai paathai la bike ottu da!<br>Forest lorry-a dodge pannu,<br>Coins pudu, Horn adichu vilakku!</p>
<button onclick="go()">RIDE START 🏔️🔥</button>
<p style="font-size:9px;opacity:0.4;margin-top:14px">MADE BY KANAGARAJ | KVR GAMES</p>
</div>
<canvas id="g"></canvas>
<script>
let cv=document.getElementById('g'),ctx=cv.getContext('2d'),W,H,px,score=0,coins=0,spd=6,obs=[],coin=[],keys={},run=false,trees=[],fog=0;
function resize(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;px=W/2;trees=[];for(let i=0;i<20;i++)trees.push({x:Math.random()*W,y:Math.random()*H, s:Math.random()*0.8+0.5});}resize();
addEventListener('resize',resize);
function go(){document.getElementById('start').style.display='none';run=true;init();}
function init(){px=W/2;score=0;coins=0;spd=6;obs=[];coin=[];}
function spawn(){if(Math.random()<0.045)obs.push({x:Math.random()*W*0.6+W*0.2,y:-80,type:Math.random()>0.5?'lorry':'rock'});if(Math.random()<0.04)coin.push({x:Math.random()*W*0.6+W*0.2,y:-20});}
function loop(){
if(!run){requestAnimationFrame(loop);return;}
spawn();fog+=0.02;
if(keys.l)px-=7;if(keys.r)px+=7;px=Math.max(30,Math.min(W-30,px));
obs.forEach((o,i)=>{o.y+=spd;if(o.y>H+80)obs.splice(i,1);if(Math.abs(o.x-px)<32 && Math.abs(o.y-(H-150))<42){alert('DEI MALAI LA VIZHUNTA DA! 😅 Score:'+Math.floor(score)+' KM');init();}});
coin.forEach((c,i)=>{c.y+=spd;if(c.y>H)coin.splice(i,1);if(Math.hypot(c.x-px,c.y-(H-150))<30){coins++;score+=12;coin.splice(i,1);}});
score+=0.12;spd=6+score*0.012;
document.getElementById('s').textContent=Math.floor(score);
document.getElementById('c2').textContent=coins;
// BG
ctx.fillStyle='#0a1a0a';ctx.fillRect(0,0,W,H);
// Hills bg
ctx.fillStyle='#122612';ctx.beginPath();ctx.moveTo(0,H*0.3);for(let x=0;x<W;x+=20){ctx.lineTo(x,H*0.3+Math.sin(x*0.01+fog)*20);}ctx.lineTo(W,H*0.3);ctx.fill();
ctx.fillStyle='#1a331a';ctx.beginPath();ctx.moveTo(0,H*0.2);for(let x=0;x<W;x+=25){ctx.lineTo(x,H*0.2+Math.sin(x*0.008+fog*0.5)*30);}ctx.lineTo(W,H*0.2);ctx.fill();
// Road
ctx.fillStyle='#2a3a2a';ctx.fillRect(W*0.12,0,W*0.76,H);
ctx.fillStyle='#3a4a3a';ctx.fillRect(W*0.14,0,W*0.72,H);
// Lane line
ctx.strokeStyle='rgba(124,252,0,0.3)';ctx.setLineDash([18,18]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
// Trees side
ctx.fillStyle='rgba(34,100,34,0.5)';trees.forEach(t=>{ctx.beginPath();ctx.arc(t.x%W,H*0.5+Math.sin(fog+t.s)*10,t.s*4,0,6.28);ctx.fill();});
// Obs
obs.forEach(o=>{
if(o.type=='lorry'){ctx.fillStyle='#8B4513';ctx.fillRect(o.x-22,o.y-25,44,50);ctx.fillStyle='#5a2a10';ctx.fillRect(o.x-22,o.y+15,44,10);}
else {ctx.fillStyle='#555';ctx.beginPath();ctx.arc(o.x,o.y,18,0,6.28);ctx.fill();}
});
ctx.fillStyle='gold';coin.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,10,0,6.28);ctx.fill();ctx.fillStyle='#000';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('₹',c.x,c.y+3);ctx.fillStyle='gold';});
// Bike
ctx.font='42px Arial';ctx.textAlign='center';ctx.fillText('🏍️',px,H-150);
ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(px,H-115,18,6,0,0,6.28);ctx.fill();
// Fog
ctx.fillStyle='rgba(200,255,200,0.03)';ctx.fillRect(0,0,W,H);
requestAnimationFrame(loop);
}loop();
let L=document.getElementById('left'),R=document.getElementById('right'),Ho=document.getElementById('horn');
L.addEventListener('touchstart',e=>{e.preventDefault();keys.l=true;});L.addEventListener('touchend',()=>keys.l=false);
R.addEventListener('touchstart',e=>{e.preventDefault();keys.r=true;});R.addEventListener('touchend',()=>keys.r=false);
L.addEventListener('mousedown',()=>keys.l=true);L.addEventListener('mouseup',()=>keys.l=false);
R.addEventListener('mousedown',()=>keys.r=true);R.addEventListener('mouseup',()=>keys.r=false);
Ho.addEventListener('touchstart',()=>{obs.forEach(o=>{if(Math.abs(o.x-px)<90)o.x+=o.x>px?55:-55;});});
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')keys.l=true;if(e.key=='ArrowRight')keys.r=true;});
addEventListener('keyup',e=>{if(e.key=='ArrowLeft')keys.l=false;if(e.key=='ArrowRight')keys.r=false;});
</script>
</body>
</html>
